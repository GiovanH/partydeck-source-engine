// PartyDeck gamepad.cfg for hl2dm (source)
// ZOOM=True
// FLASHLIGHT=False
// CHANGECLASS=False
// PHYS_SWAP=False

joystick 1

joyadvanced "1"
joyadvaxisx "3"
joyadvaxisy "1"
joyadvaxisr "2"
joyadvaxisz "4"

joysidesensitivity "1.0"
joyadvancedupdate

// joy_pitchsensitivity "1.0"
// joy_yawsensitivity "-1.25"
// joy_response_move "5"
// joy_response_look "1"
// joy_lowend "0.65"
// joy_lowmap "0.15"
// joy_accelscale "1.4"
// joy_autoaimdampenrange "0.85"
// joy_autoaimdampen "0.5"

crosshair 1

+jlook
player_limit_jump_speed 0
joy_advanced 1

hud_fastswitch 0

// Pad

alias +al_A_BUTTON +jump
alias -al_A_BUTTON -jump
bind A_BUTTON +al_A_BUTTON
alias +al_B_BUTTON +duck
alias -al_B_BUTTON -duck
bind B_BUTTON +al_B_BUTTON
alias +al_X_BUTTON +reload
alias -al_X_BUTTON -reload
bind X_BUTTON +al_X_BUTTON
alias +al_Y_BUTTON +use
alias -al_Y_BUTTON -use
bind Y_BUTTON +al_Y_BUTTON

// Start/select


alias +al_BACK +showscores
alias -al_BACK -showscores
bind BACK +al_BACK
alias +al_JOY7 +showscores
alias -al_JOY7 -showscores
bind JOY7 +al_JOY7
alias +al_AUX5 +showscores
alias -al_AUX5 -showscores
bind AUX5 +al_AUX5

bind START pause
bind JOY8 pause
bind AUX7 pause

// D-pad

//bind LEFT invprev
//bind RIGHT invnextbind POV_UP lastinvbind POV_DOWN lastinv

bind POV_LEFT invprev
bind POV_RIGHT invnext

// Sticks
// not flashlight
alias +al_STICK1 +speed
alias -al_STICK1 -speed
bind STICK1 +al_STICK1

bind STICK2 toggle_zoom


// Source engine: triggers and shoulders

bind L_SHOULDER lastinv
alias +al_L_TRIGGER +speed
alias -al_L_TRIGGER -speed
bind L_TRIGGER +al_L_TRIGGER

alias +al_R_SHOULDER +attack2
alias -al_R_SHOULDER -attack2
bind R_SHOULDER +al_R_SHOULDER
alias +al_R_TRIGGER +attack
alias -al_R_TRIGGER -attack
bind R_TRIGGER +al_R_TRIGGER

echo "OK!"
