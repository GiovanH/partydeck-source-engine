// PartyDeck gamepad.cfg for hl (goldsrc)
// ZOOM=False
// FLASHLIGHT=False
// CHANGECLASS=False
// PHYS_SWAP=False

joystick 1

joyadvanced "1"
joyadvaxisx "3"
joyadvaxisy "1"
joyadvaxisr "2"
joyadvaxisz "4"

joysidesensitivity "1.0"
joyadvancedupdate

// joy_pitchsensitivity "1.0"
// joy_yawsensitivity "-1.25"
// joy_response_move "5"
// joy_response_look "1"
// joy_lowend "0.65"
// joy_lowmap "0.15"
// joy_accelscale "1.4"
// joy_autoaimdampenrange "0.85"
// joy_autoaimdampen "0.5"

crosshair 1

+jlook

hud_fastswitch 0

// Pad

alias +al_JOY1 +jump
alias -al_JOY1 -jump
bind JOY1 +al_JOY1
alias +al_JOY2 +duck
alias -al_JOY2 -duck
bind JOY2 +al_JOY2
alias +al_JOY3 +reload
alias -al_JOY3 -reload
bind JOY3 +al_JOY3
alias +al_JOY4 +use
alias -al_JOY4 -use
bind JOY4 +al_JOY4

// Start/select


alias +al_BACK +showscores
alias -al_BACK -showscores
bind BACK +al_BACK
alias +al_JOY7 +showscores
alias -al_JOY7 -showscores
bind JOY7 +al_JOY7
alias +al_AUX5 +showscores
alias -al_AUX5 -showscores
bind AUX5 +al_AUX5

bind START pause
bind JOY8 pause
bind AUX7 pause

// D-pad

//bind AUX14 invprev
//bind AUX15 invnextbind AUX12 lastinvbind AUX13 lastinv

bind AUX14 invprev
bind AUX15 invnext

// Sticks
// not flashlight
alias +al_AUX8 +speed
alias -al_AUX8 -speed
bind AUX8 +al_AUX8


// Goldsrc: no triggers, only shoulders

alias +al_AUX10 +attack2
alias -al_AUX10 -attack2
bind AUX10 +al_AUX10
alias +al_AUX11 +attack
alias -al_AUX11 -attack
bind AUX11 +al_AUX11

alias +al_Z AXIS POS +attack2
alias -al_Z AXIS POS -attack2
bind Z AXIS POS +al_Z AXIS POS
alias +al_Z AXIS NEG +attack
alias -al_Z AXIS NEG -attack
bind Z AXIS NEG +al_Z AXIS NEG

echo "OK!"
