echo "Execing gamepad.cfg"

joy_advaxisx "3"
joy_advaxisy "1"
joy_advaxisr "2"
joy_advaxisu "4"
joy_pitchsensitivity "1.0"
joy_yawsensitivity "-1.25"
joy_response_move "5"
joy_response_look "1"
joy_lowend "0.65"
joy_lowmap "0.15"
joy_accelscale "1.4"
joy_autoaimdampenrange "0.85"
joy_autoaimdampen "0.5"
joystick "1"
joystick "1"

hud_fastswitch 0

echo "Try all the names"

// Try all the names.

bind "A_BUTTON" "+jump"
bind "JOY1" "+jump"

bind "B_BUTTON" "+duck"
bind "JOY2" "+duck"

bind "X_BUTTON" "+reload"
bind "JOY3" "+reload"

bind "Y_BUTTON" "+use"
bind "JOY4" "+use"

bind "BACK" "+showscores"
bind "JOY7" "+showscores"
bind "AUX5" "+showscores"

bind "START" "pause"
bind "JOY8" "pause"
bind "AUX7" "pause"

bind "LEFT" "invprev"
bind "AUX14" "invprev"

bind "RIGHT" "invnext"
bind "AUX15" "invnext"

bind "STICK1" "+speed"
bind "AUX8" "+speed"

// Source engine: triggers and shoulders

bind "L_SHOULDER" "invprev"
bind "AUX10" "invprev"

bind "R_SHOULDER" "invnext"
bind "AUX11" "invnext"

bind "L_TRIGGER" "+speed"

bind "R_TRIGGER" "+attack"
bind "AUX11" "+attack"

// Goldsrc: no triggers, only shoulders

// bind "L_SHOULDER" "+attack2"
// bind "AUX10" "+attack2"

// bind "R_SHOULDER" "+attack"
// bind "AUX11" "+attack"

echo "Jake!"
